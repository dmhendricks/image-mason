version: 2

# The Dockerfile's base images and source-built tools are pinned with ARGs, which Dependabot can't update.
# Check those by hand: alpine, the .NET images, NODE_VERSION, RUST_VERSION, LIBVIPS_VERSION, MOZJPEG_VERSION,
# LIBJXL_VERSION, JPEGLI_COMMIT, LIBAVIF_VERSION, AOM_VERSION, DAV1D_VERSION and OXIPNG_VERSION (with its SHA-256 sums).
updates:
  # The scorer's crates (src/ssim2). A crate that ships no license file fails the image build (src/ssim2/notices.sh).
  - package-ecosystem: cargo
    directory: /src/ssim2
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # TypeScript stays on 6.x until typescript-eslint and vue-tsc support 7 (the native compiler).
    # @types/node matches the Node version the build uses (NODE_VERSION in the Dockerfile, node-version in ci.yml),
    # so its major moves with those by hand.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
