name: CI

# Jobs that run in parallel and never push anything:
#
#   test   - unit tests and shell script lint.
#   web    - the web interface (src/web): lint, type check, unit tests, build and the JavaScript size budget.
#   image  - one per architecture, each on a native runner: builds the image and runs scripts/smoke-test.sh
#            against it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test --solution ImageMason.slnx -c Release

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  web:
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: src/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Type checks first (npm run build runs vue-tsc, then vite build).
      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The tools stage compiles libjxl, mozjpeg, libvips and libavif; the GitHub Actions cache keeps it
      # between runs, one scope per architecture (shared with the release workflow).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: image-mason:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh image-mason:ci 0.0.0-ci
