name: CI

# Two jobs that run in parallel and never push anything:
#
#   test   - unit tests and shell script lint.
#   image  - builds the image and runs scripts/smoke-test.sh against it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test --solution ImageMason.slnx -c Release

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The tools stage compiles libjxl, mozjpeg and libvips; the GitHub Actions cache keeps it between runs.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: image-mason:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh image-mason:ci 0.0.0-ci
