name: CI

# Jobs that run in parallel and never push anything:
#
#   test   - unit tests and shell script lint.
#   web    - the web interface (src/web): lint, type check, unit tests, build and the JavaScript size budget.
#   image  - one per architecture, each on a native runner: builds the image and runs scripts/smoke-test.sh
#            against it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main all finish, since they write the tools cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test --solution ImageMason.slnx -c Release

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        # No install scripts: the only packages with any are optional file watchers the build doesn't use.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Type checks first (npm run build runs vue-tsc, then vite build).
      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}
    # About 13 minutes when the tools stage has to compile; a few with the cache.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The tools stage compiles libvips, mozjpeg, libjxl, jpegli, dav1d, aom and libavif (about 13 minutes), so
      # it's the only stage kept in the GitHub Actions cache, one scope per architecture. The rest rebuilds each
      # run in a minute or two, and caching it would add a few hundred MB per push. Only main writes the cache;
      # pull requests and the release workflow can read main's.
      - name: Build tools
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tools
          platforms: linux/${{ matrix.arch }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=tools-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=gha,scope=tools-{0},mode=max', matrix.arch) || '' }}

      # The tools come from the builder's cache, filled by the step above.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: image-mason:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha,scope=tools-${{ matrix.arch }}

      - name: Smoke test
        run: scripts/smoke-test.sh image-mason:ci 0.0.0-ci
