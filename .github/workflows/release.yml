name: Release

# Runs when a version tag is pushed:
#
#   1. Move the Unreleased notes in CHANGELOG.md under "## [X.Y.Z] - YYYY-MM-DD" and commit.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Jobs:
#
#   test     - unit tests, and checks that CHANGELOG.md has a section for the version.
#   build    - one per architecture, each on a native runner (no QEMU): builds the image and pushes it to Docker
#              Hub by digest only (no tag yet), with provenance and an SBOM, then pulls that digest and smoke tests
#              it. A digest that fails is left untagged.
#   publish  - once both architectures pass, tags one multi-arch image from the two digests, creates the
#              GitHub release, and syncs the Docker Hub description. Nothing is tagged unless both passed.
#
# v1.2.3 is pushed as 1.2.3, 1.2 and, when it's the highest release tag, latest. A prerelease such as v1.3.0-rc.1
# is pushed as 1.3.0-rc.1 only.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account
#   DOCKERHUB_TOKEN    - Docker Hub personal access token with Read, Write, Delete access (the description
#                        sync needs Delete)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: hendridm/image-mason

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::Tag $TAG is not a version such as v1.2.3 or v1.3.0-rc.1"
              exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::No '## [$VERSION]' section. Move the Unreleased notes under it before tagging."
              exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test --solution ImageMason.slnx -c Release

  build:
    needs: test

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest only, with no tag, so nothing points at it until the publish job tags it once both
      # architectures pass. The Dockerfile sets the title, description and version labels; only the commit is
      # added here. The compiled tools come from the cache CI writes on main (see ci.yml). A tag can read main's
      # cache, but what it writes only it could read, so it writes nothing.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tools-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      # The pushed image itself, pulled back by digest, so what's tested is exactly what gets tagged.
      - name: Smoke test
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE_NAME@$DIGEST"
          scripts/smoke-test.sh "$IMAGE_NAME@$DIGEST" "$VERSION"

      - name: Save digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [test, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # latest (on Docker Hub and GitHub) moves only to the highest release, so a fix released for an older
      # line, or two tags released at once, can't move it back. Read just before tagging, from the API.
      - name: Is this the highest release?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Highest release tag: $highest"
          echo "latest=$([[ "$GITHUB_REF_NAME" == "$highest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # For a prerelease, {{major}}.{{minor}} resolves to the full version, so only that tag is pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=${{ steps.newest.outputs.latest }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

      - name: Release notes
        run: |
          awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
              found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
              echo
              echo "**Docker image** (linux/amd64 and linux/arm64): \`docker pull $IMAGE_NAME:$VERSION\`"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.test.outputs.prerelease }}
          make_latest: ${{ steps.newest.outputs.latest }}

      # Keep the Docker Hub overview in sync with README.md. Only when latest moved, so the page always describes
      # the image that latest points to.
      - name: Sync Docker Hub description
        if: steps.newest.outputs.latest == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: Self-hosted API that shrinks and converts JPEG, PNG, WebP, AVIF and JPEG XL images
          readme-filepath: ./README.md
