<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wall: three courses in running bond. Edges sit on even units so they stay sharp at 32px. -->
  <g>
    <rect x="2" y="32" width="18" height="8" rx="1.5" fill="#c9573a"/>
    <rect x="22" y="32" width="18" height="8" rx="1.5" fill="#b5432a"/>
    <rect x="42" y="32" width="18" height="8" rx="1.5" fill="#d66845"/>

    <rect x="2" y="42" width="8" height="8" rx="1.5" fill="#b5432a"/>
    <rect x="12" y="42" width="18" height="8" rx="1.5" fill="#a33a23"/>
    <rect x="32" y="42" width="18" height="8" rx="1.5" fill="#c9573a"/>
    <rect x="52" y="42" width="8" height="8" rx="1.5" fill="#b5432a"/>

    <rect x="2" y="52" width="18" height="8" rx="1.5" fill="#d66845"/>
    <rect x="22" y="52" width="18" height="8" rx="1.5" fill="#c9573a"/>
    <rect x="42" y="52" width="18" height="8" rx="1.5" fill="#a33a23"/>
  </g>

  <!-- Trowel: drawn pointing along +x from its tip, then placed and tilted -->
  <g transform="translate(7 29) rotate(-28)" stroke-linejoin="round">
    <path d="M0 0 L24 -9 L24 0 Z" fill="#d5dae0" stroke="#d5dae0" stroke-width="2"/>
    <path d="M0 0 L24 0 L24 9 Z" fill="#a9b1bb" stroke="#a9b1bb" stroke-width="2"/>
    <rect x="24" y="-1.5" width="8" height="3" rx="1.5" fill="#8f969f"/>
    <path d="M34 -4 H40 V0 H30 A4 4 0 0 1 34 -4 Z" fill="#f9b872"/>
    <path d="M30 0 H40 V4 H34 A4 4 0 0 1 30 0 Z" fill="#ec9a4c"/>
    <path d="M40 -4 A4 4 0 0 1 44 0 H40 Z" fill="#f9b872"/>
    <path d="M40 0 H44 A4 4 0 0 1 40 4 Z" fill="#ec9a4c"/>
  </g>
</svg>
